[project]
name = "lti-insight"
version = "0.1.0"
description = "A股 LTI(长期激励) 草案追踪与洞察工具：抓取 → 抽取 → 按模板落 Excel → 热点报告"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.30",
    "openpyxl>=3.1",
    "requests>=2.31",
    "pdfplumber>=0.11",
    "pyyaml>=6.0",
    "pandas>=2.0",
]

[project.scripts]
lti = "lti_insight.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
