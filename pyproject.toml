[project]
name = "lti-insight"
version = "0.1.0"
description = "A股 LTI(长期激励) 草案追踪与洞察工具：抓取 → 抽取 → 按模板落 Excel → 热点报告"
requires-python = ">=3.12"
# 依赖统一在 requirements.txt 声明，避免 Streamlit Cloud "More than one requirement" 冲突

[project.scripts]
lti = "lti_insight.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
